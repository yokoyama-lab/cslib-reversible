name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

# The axiom audit lives in `CslibReversible/Audit.lean`: `#print axioms` is
# wrapped in `#guard_msgs`, so a stray `sorryAx` or a new axiom makes the
# *build* fail.  That is why this workflow does not grep for `sorry` — the
# kernel check is stronger and has no false positives from docstrings.
jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    # `pull-requests: write` is only for the error-reporting step at the end.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Installs elan from `lean-toolchain`, fetches the Mathlib cache (CSLib
      # pins its own Mathlib, so this is what keeps CI at minutes rather than
      # hours), and runs `lake build`.
      # `--wfail` is on: the build is warning-free as of 2026-08-08, and the
      # only way it stays that way is if a new warning breaks CI.  The two
      # classes that had to be cleared first were the missing `Authors:` line
      # in every file header and two uses of `show` where `change` is meant.
      - uses: leanprover/lean-action@v1
        id: build
        with:
          build-args: "--iofail --wfail"

      # The root file must import every module, in sorted order.  Without this
      # a new file can be silently unverified: it builds locally because the
      # author imports it by hand, but nothing in CI ever reaches it.
      - name: lake exe mk_all --check
        run: lake exe mk_all --check

      # Mathlib's text-based style linter (adaptation notes, line endings,
      # trailing whitespace, stray semicolons).  The module argument is not
      # optional: without it the linter falls back to a default target that
      # does not include our files, and passes no matter what they contain —
      # measured on 2026-08-08 by feeding it a deliberately broken file.
      - name: lake exe lint-style
        run: lake exe lint-style CslibReversible

      # The bounded exhaustive check that `Complexity/Sorting.lean` cites for
      # the general alphabet size (it exits non-zero on any mismatch).  It is
      # evidence of the bounded kind only, not a proof.
      - name: experiments/multiset_rank_ref.py
        run: python3 experiments/multiset_rank_ref.py

      # CI as compiler.  The job log is not reachable from every place a
      # patch is written, so when the build step fails we replay `lake build`
      # (the modules that already built are cached, so only the failing ones
      # are re-elaborated) and post the tail of its output as a PR comment.
      # Both steps run only for a failed *build*, not for mk_all/lint-style.
      - name: Collect lake build errors
        if: failure() && steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        timeout-minutes: 15
        run: |
          (lake build --iofail --wfail 2>&1 || true) | tail -n 150 > build-tail.txt

      - name: Post lake build errors as a PR comment
        if: failure() && steps.build.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let tail = '';
            try { tail = fs.readFileSync('build-tail.txt', 'utf8'); } catch (e) { tail = `(no build-tail.txt: ${e.message})`; }
            if (tail.length > 60000) tail = tail.slice(-60000);
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request.head.sha;
            const body = ['lake build errors (auto-posted by CI)', '', `Run: ${run} (head ${sha})`, '', '```', tail, '```'].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
